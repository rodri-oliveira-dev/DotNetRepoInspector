name: DotNetRepoInspector
description: Inspect and classify .NET projects using evaluated MSBuild metadata.
author: Rodrigo de Oliveira

inputs:
  path:
    description: Repository path to inspect, relative to the workspace when not absolute.
    required: false
    default: "."
  output:
    description: Destination path for the inspection JSON. Defaults to an Action-owned temporary file.
    required: false
    default: ""
  verbosity:
    description: Operational logging level. Supported values are normal, verbose, and debug.
    required: false
    default: normal
  config:
    description: Repository-relative configuration file. Defaults to .dotnetrepoinspector.json when present.
    required: false
    default: ""
  no-config:
    description: Set to true to ignore the default repository configuration file.
    required: false
    default: "false"
  exclude:
    description: Newline-separated repository-relative directories or project paths to exclude.
    required: false
    default: ""
  classify:
    description: Newline-separated '<project-path>=<kind>' classification overrides.
    required: false
    default: ""
  sink-url:
    description: Optional HTTP/HTTPS endpoint that enables snapshot persistence through the built-in HTTP sink.
    required: false
    default: ""
  sink-token:
    description: Optional bearer token for the HTTP sink. Supply it from a GitHub Actions secret.
    required: false
    default: ""
  sink-timeout-seconds:
    description: Overall persistence timeout in seconds when sink-url is configured.
    required: false
    default: "15"
  sink-failure-mode:
    description: Persistence failure mode when sink-url is configured. Supported values are non-fatal and fatal.
    required: false
    default: non-fatal
  sink-max-attempts:
    description: Maximum HTTP attempts for transient persistence failures. Supported range is 1 to 5.
    required: false
    default: "3"

outputs:
  report-path:
    description: Absolute path to the generated inspection JSON when a report exists.
    value: "${{ steps.inspect.outputs.report-path }}"
  schema-version:
    description: Inspection schema version read from the generated report when available.
    value: "${{ steps.inspect.outputs.schema-version }}"
  inspector-version:
    description: Exact DotNetRepoInspector .NET Tool version pinned by this Action revision.
    value: "${{ steps.inspect.outputs.inspector-version }}"
  exit-code:
    description: Exit code returned by the DotNetRepoInspector CLI.
    value: "${{ steps.inspect.outputs.exit-code }}"

runs:
  using: composite
  steps:
    - name: Setup Inspector .NET SDK
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
      with:
        dotnet-version: "10.0.x"

    - name: Inspect repository
      id: inspect
      shell: pwsh
      env:
        DRI_ACTION_PATH: "${{ github.action_path }}"
        DRI_INPUT_PATH: "${{ inputs.path }}"
        DRI_INPUT_OUTPUT: "${{ inputs.output }}"
        DRI_INPUT_VERBOSITY: "${{ inputs.verbosity }}"
        DRI_INPUT_CONFIG: "${{ inputs.config }}"
        DRI_INPUT_NO_CONFIG: "${{ inputs['no-config'] }}"
        DRI_INPUT_EXCLUDE: "${{ inputs.exclude }}"
        DRI_INPUT_CLASSIFY: "${{ inputs.classify }}"
        DRI_INPUT_SINK_URL: "${{ inputs['sink-url'] }}"
        DRI_INPUT_SINK_TIMEOUT_SECONDS: "${{ inputs['sink-timeout-seconds'] }}"
        DRI_INPUT_SINK_FAILURE_MODE: "${{ inputs['sink-failure-mode'] }}"
        DRI_INPUT_SINK_MAX_ATTEMPTS: "${{ inputs['sink-max-attempts'] }}"
        DRI_TOOL_VERSION: "1.0.0"
        DOTNET_REPO_INSPECTOR_HTTP_TOKEN: "${{ inputs['sink-token'] }}"
        DOTNET_REPO_INSPECTOR_EXECUTION_ID: "${{ github.run_id }}:${{ github.run_attempt }}"
        DOTNET_REPO_INSPECTOR_EXECUTION_PROVIDER: github-actions
        DOTNET_REPO_INSPECTOR_EXECUTION_REF: "${{ github.ref }}"
      run: '& (Join-Path $env:DRI_ACTION_PATH ".github/action/invoke.ps1")'

branding:
  icon: search
  color: purple
