# One weekly version-update PR across NuGet, Docker, and GitHub Actions.
# Security updates remain managed separately by Dependabot.
version: 2

multi-ecosystem-groups:
  weekly-dependencies:
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Sao_Paulo"
    open-pull-requests-limit: 1

updates:
  - package-ecosystem: "nuget"
    directory: "/"
    patterns:
      - "*"
    multi-ecosystem-group: "weekly-dependencies"

  - package-ecosystem: "github-actions"
    directory: "/"
    patterns:
      - "*"
    multi-ecosystem-group: "weekly-dependencies"

  - package-ecosystem: "docker"
    directory: "/"
    patterns:
      - "*"
    multi-ecosystem-group: "weekly-dependencies"
    # Major SDK image changes require a manual compatibility review.
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
