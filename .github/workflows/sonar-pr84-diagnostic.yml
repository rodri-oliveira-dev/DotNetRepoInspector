name: Apply PR84 Sonar Fix

on:
  push:
    branches:
      - fix/sonar-security-issues
    paths:
      - .github/workflows/sonar-pr84-diagnostic.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true

      - name: Exclude CI infrastructure from coverage metric only
        shell: python
        run: |
          from pathlib import Path

          path = Path('.github/workflows/validate.yml')
          content = path.read_text(encoding='utf-8')
          marker = '          /d:sonar.cs.opencover.reportsPaths="artifacts/coverage/sonar/DotNetRepoInspector.Core.Tests/coverage.opencover.xml,artifacts/coverage/sonar/DotNetRepoInspector.MSBuild.Tests/coverage.opencover.xml,artifacts/coverage/sonar/DotNetRepoInspector.Git.Tests/coverage.opencover.xml,artifacts/coverage/sonar/DotNetRepoInspector.Engine.Tests/coverage.opencover.xml,artifacts/coverage/sonar/DotNetRepoInspector.Persistence.Tests/coverage.opencover.xml,artifacts/coverage/sonar/DotNetRepoInspector.Persistence.Http.Tests/coverage.opencover.xml,artifacts/coverage/sonar/DotNetRepoInspector.Cli.Tests/coverage.opencover.xml"\n'
          addition = marker + '          /d:sonar.coverage.exclusions=".github/**"\n'

          if content.count(marker) != 1:
              raise SystemExit(f'Expected exactly one Sonar coverage report setting, found {content.count(marker)}.')

          path.write_text(content.replace(marker, addition), encoding='utf-8')

      - name: Restore script executable bit and commit fix
        shell: bash
        run: |
          set -euo pipefail
          chmod +x .github/scripts/coverage_summary.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -- .github/workflows/sonar-pr84-diagnostic.yml
          git add -- .github/workflows/validate.yml .github/scripts/coverage_summary.py
          git commit -m "fix(ci): exclude workflow infrastructure from Sonar coverage"
          git push origin HEAD:fix/sonar-security-issues
