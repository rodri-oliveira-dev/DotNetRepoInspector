name: Sonar PR84 Diagnostic

on:
  push:
    branches:
      - fix/sonar-security-issues
    paths:
      - .github/workflows/sonar-pr84-diagnostic.yml

permissions:
  contents: read
  statuses: write

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - name: Publish sanitized Sonar PR diagnostics
        shell: bash
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          curl --fail --silent --show-error \
            --user "${SONAR_TOKEN}:" \
            "https://sonarcloud.io/api/qualitygates/project_status?projectKey=rodri-oliveira-dev_DotNetRepoInspector&pullRequest=84" \
            --output /tmp/gate.json

          curl --fail --silent --show-error \
            --user "${SONAR_TOKEN}:" \
            "https://sonarcloud.io/api/issues/search?componentKeys=rodri-oliveira-dev_DotNetRepoInspector&pullRequest=84&issueStatuses=OPEN%2CCONFIRMED&ps=100" \
            --output /tmp/issues.json

          python3 - <<'PY' >/tmp/statuses.txt
          import json
          import urllib.parse

          with open('/tmp/gate.json', encoding='utf-8') as f:
              gate = json.load(f).get('projectStatus', {})
          print('sonardiag/gate|' + gate.get('status', 'UNKNOWN'))
          for i, condition in enumerate(gate.get('conditions', []), 1):
              parts = [
                  condition.get('status', ''),
                  condition.get('metricKey', ''),
                  condition.get('comparator', ''),
                  str(condition.get('errorThreshold', '')),
                  str(condition.get('actualValue', '')),
              ]
              value = '|'.join(parts)
              print(f'sonardiag/condition/{i:02d}|' + value[:115])

          with open('/tmp/issues.json', encoding='utf-8') as f:
              issues = json.load(f).get('issues', [])
          print(f'sonardiag/issues|{len(issues)}')
          for i, issue in enumerate(issues, 1):
              component = issue.get('component', '').split(':')[-1]
              parts = [
                  issue.get('rule', ''),
                  f"L{issue.get('line', '')}",
                  issue.get('severity', ''),
                  component,
              ]
              print(f'sonardiag/issue/{i:02d}|' + '|'.join(parts)[:115])
          PY

          while IFS= read -r context; do
            curl --fail --silent --show-error \
              --request POST \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${SHA}" \
              --data "$(python3 -c 'import json,sys; print(json.dumps({"state":"success","context":sys.argv[1]}))' "$context")" \
              >/dev/null
          done </tmp/statuses.txt
