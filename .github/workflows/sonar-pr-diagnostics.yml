name: Sonar PR diagnostics

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality-gate:
    name: Report Sonar quality gate
    if: github.event.pull_request.number == 115
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Query SonarQube Cloud quality gate
        shell: bash
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "${SONAR_TOKEN}" ]; then
            echo "SONAR_TOKEN is required." >&2
            exit 1
          fi

          response="$(curl --fail --silent --show-error \
            --user "${SONAR_TOKEN}:" \
            --get 'https://sonarcloud.io/api/qualitygates/project_status' \
            --data-urlencode 'projectKey=rodri-oliveira-dev_DotNetRepoInspector' \
            --data-urlencode 'pullRequest=115')"

          echo "Quality Gate response:"
          jq . <<< "${response}"

          echo "Failing conditions:"
          jq -r '.projectStatus.conditions[]? | select(.status != "OK") | [.metricKey, .status, .actualValue, .comparator, .errorThreshold] | @tsv' <<< "${response}"

      - name: Query unresolved Sonar issues
        shell: bash
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          set -euo pipefail

          response="$(curl --fail --silent --show-error \
            --user "${SONAR_TOKEN}:" \
            --get 'https://sonarcloud.io/api/issues/search' \
            --data-urlencode 'componentKeys=rodri-oliveira-dev_DotNetRepoInspector' \
            --data-urlencode 'pullRequest=115' \
            --data-urlencode 'resolved=false' \
            --data-urlencode 'ps=100')"

          echo "Open issues on PR analysis:"
          jq -r '.issues[]? | [.key, .severity, .type, .rule, .component, (.line // 0), .message] | @tsv' <<< "${response}"
