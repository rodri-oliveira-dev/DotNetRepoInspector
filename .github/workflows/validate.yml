name: Validate .NET

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "validate-${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  workflow-lint:
    name: Validate GitHub Actions workflows
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
        run: |
          set -euo pipefail
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          url="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"

          curl --fail --silent --show-error --location "$url" --output "$archive"
          echo "${ACTIONLINT_SHA256}  ${archive}" | sha256sum --check -
          tar -xzf "$archive" actionlint
          ./actionlint -version

      - name: Validate workflow syntax and expressions
        run: ./actionlint -shellcheck= -pyflakes= .github/workflows/*.yml

  build-test-quality:
    name: Build, test and quality
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      - name: Show .NET information
        run: dotnet --info

      - name: Restore
        run: dotnet restore ./DotNetRepoInspector.slnx

      - name: Verify formatting and analyzer fixes
        run: >-
          dotnet format ./DotNetRepoInspector.slnx
          --verify-no-changes
          --no-restore
          --severity warn

      - name: Build with static analysis and zero warnings
        run: >-
          dotnet build ./DotNetRepoInspector.slnx
          --configuration Release
          --no-restore
          --warnaserror
          -p:RunAnalyzers=true

      - name: Test with coverage
        run: >-
          dotnet test ./DotNetRepoInspector.slnx
          --configuration Release
          --no-build
          --no-restore
          --collect:"XPlat Code Coverage"
          --results-directory ./artifacts/test-results

      - name: Summarize coverage
        run: |
          python - <<'PY'
          import glob
          import os
          import xml.etree.ElementTree as ET

          reports = sorted(glob.glob("artifacts/test-results/**/coverage.cobertura.xml", recursive=True))
          if not reports:
              raise SystemExit("No Cobertura coverage reports were generated.")

          summary_path = os.environ["GITHUB_STEP_SUMMARY"]
          with open(summary_path, "a", encoding="utf-8") as summary:
              summary.write("## Code coverage\n\n")
              summary.write("| Report | Line coverage |\n")
              summary.write("| --- | ---: |\n")

              for report in reports:
                  root = ET.parse(report).getroot()
                  line_rate = float(root.attrib.get("line-rate", "0")) * 100
                  summary.write(f"| `{report}` | {line_rate:.2f}% |\n")
          PY
