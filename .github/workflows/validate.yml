name: Validate .NET

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "validate-${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  workflow-lint:
    name: Validate GitHub Actions workflows
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
        run: |
          set -euo pipefail
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          url="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"

          curl --fail --silent --show-error --location "$url" --output "$archive"
          echo "${ACTIONLINT_SHA256}  ${archive}" | sha256sum --check -
          tar -xzf "$archive" actionlint
          ./actionlint -version

      - name: Validate workflow syntax and expressions
        run: ./actionlint -shellcheck= -pyflakes= .github/workflows/*.yml

  dependency-review:
    name: Review dependency changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  build-test-quality:
    name: Build, test and quality
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      - name: Show .NET information
        run: dotnet --info

      - name: Restore
        run: dotnet restore ./DotNetRepoInspector.slnx

      - name: Verify formatting and analyzer fixes
        run: >-
          dotnet format ./DotNetRepoInspector.slnx
          --verify-no-changes
          --no-restore
          --severity warn

      - name: Build with static analysis and zero warnings
        run: >-
          dotnet build ./DotNetRepoInspector.slnx
          --configuration Release
          --no-restore
          --warnaserror
          -p:RunAnalyzers=true

      - name: Test with coverage
        run: >-
          dotnet test
          --solution ./DotNetRepoInspector.slnx
          --configuration Release
          --no-build
          --no-restore
          --results-directory ./artifacts/test-results
          --
          --report-trx
          --coverlet
          --coverlet-output-format cobertura

      - name: Consolidate and enforce coverage
        if: always()
        run: >-
          python ./.github/scripts/coverage_summary.py
          --reports "artifacts/test-results/**/*cobertura*.xml"
          --baseline ./.github/coverage-baseline.json

      - name: Upload test and coverage artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-results-and-coverage
          path: |
            artifacts/test-results
            artifacts/coverage
          if-no-files-found: warn
          retention-days: 14

  compatibility:
    name: Compatibility (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 8.0.x

      - name: Setup Inspector SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      - name: Verify side-by-side SDKs
        shell: pwsh
        run: |
          $sdks = @(dotnet --list-sdks)
          $sdks | ForEach-Object { Write-Host $_ }

          foreach ($prefix in @("8.0.", "10.0.")) {
            $found = $sdks | Where-Object { $_.StartsWith($prefix, [StringComparison]::Ordinal) }
            if (-not $found) {
              throw "Required SDK family '$prefix' is not installed."
            }
          }

      - name: Restore
        run: dotnet restore ./DotNetRepoInspector.slnx

      - name: Build compatibility target
        run: >-
          dotnet build ./DotNetRepoInspector.slnx
          --configuration Release
          --no-restore
          --warnaserror
          -p:RunAnalyzers=true

      - name: Run compatibility smoke tests
        shell: pwsh
        run: ./.github/scripts/compatibility_smoke.ps1
