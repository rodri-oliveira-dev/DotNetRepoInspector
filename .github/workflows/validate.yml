name: Validate .NET

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "validate-${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  workflow-lint:
    name: Validate GitHub Actions workflows
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
        run: |
          set -euo pipefail
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          url="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"

          curl --fail --silent --show-error --location --proto "=https" --proto-redir "=https" "$url" --output "$archive"
          echo "${ACTIONLINT_SHA256}  ${archive}" | sha256sum --check -
          tar -xzf "$archive" actionlint
          ./actionlint -version

      - name: Validate workflow syntax and expressions
        run: ./actionlint -shellcheck= -pyflakes= .github/workflows/*.yml

  dependency-review:
    name: Review dependency changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  build-test-quality:
    name: Build, test and quality
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      - name: Show .NET information
        run: dotnet --info

      - name: Restore
        run: dotnet restore ./DotNetRepoInspector.slnx

      - name: Verify formatting and analyzer fixes
        run: >-
          dotnet format ./DotNetRepoInspector.slnx
          --verify-no-changes
          --no-restore
          --severity warn

      - name: Build with static analysis and zero warnings
        run: >-
          dotnet build ./DotNetRepoInspector.slnx
          --configuration Release
          --no-restore
          --warnaserror
          -p:RunAnalyzers=true

      - name: Test with coverage
        run: >-
          dotnet test
          --solution ./DotNetRepoInspector.slnx
          --configuration Release
          --no-build
          --no-restore
          --results-directory ./artifacts/test-results
          --
          --report-trx
          --coverlet
          --coverlet-output-format cobertura

      - name: Consolidate and enforce coverage
        if: always()
        run: >-
          python ./.github/scripts/coverage_summary.py
          --reports "artifacts/test-results/**/*cobertura*.xml"
          --baseline ./.github/coverage-baseline.json

      - name: Pack .NET Tool
        env:
          TOOL_PACKAGE_VERSION: "0.0.0-ci.${{ github.run_number }}"
        run: >-
          dotnet pack ./src/DotNetRepoInspector.Cli/DotNetRepoInspector.Cli.csproj
          --configuration Release
          --no-restore
          --output ./artifacts/packages
          -p:Version=${TOOL_PACKAGE_VERSION}
          -p:TreatWarningsAsErrors=true
          -p:RunAnalyzers=true

      - name: Validate .NET Tool package
        shell: pwsh
        env:
          TOOL_PACKAGE_VERSION: "0.0.0-ci.${{ github.run_number }}"
        run: >-
          ./.github/scripts/validate_tool_package.ps1
          -PackageDirectory ./artifacts/packages
          -Version $env:TOOL_PACKAGE_VERSION
          -FixturePath ./tests/Fixtures/ProjectKinds
          -ArtifactsDirectory ./artifacts/tool-package-smoke

      - name: Upload .NET Tool package validation artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dotnet-tool-package-validation
          path: |
            artifacts/packages
            artifacts/tool-package-smoke
          if-no-files-found: warn
          retention-days: 14

      - name: Upload test and coverage artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-results-and-coverage
          path: |
            artifacts/test-results
            artifacts/coverage
          if-no-files-found: warn
          retention-days: 14

  sonar:
    name: SonarQube Cloud
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: build-test-quality
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.ref == 'refs/heads/main' ||
      (
        github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository
      )

    steps:
      - name: Verify SONAR_TOKEN
        shell: bash
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -z "${SONAR_TOKEN}" ]; then
            echo "SONAR_TOKEN repository secret is required."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      - name: Restore tools
        run: dotnet tool restore

      - name: Restore
        run: dotnet restore ./DotNetRepoInspector.slnx

      - name: Begin Sonar analysis
        shell: bash
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_QUALITY_GATE_WAIT: ${{ github.event_name == 'pull_request' && 'true' || 'false' }}
        run: >-
          dotnet sonarscanner begin
          /k:"rodri-oliveira-dev_DotNetRepoInspector"
          /o:"rodri-oliveira-dev"
          /d:sonar.token="${SONAR_TOKEN}"
          /d:sonar.cs.opencover.reportsPaths="artifacts/coverage/sonar/DotNetRepoInspector.Core.Tests/coverage.opencover.xml,artifacts/coverage/sonar/DotNetRepoInspector.MSBuild.Tests/coverage.opencover.xml,artifacts/coverage/sonar/DotNetRepoInspector.Git.Tests/coverage.opencover.xml,artifacts/coverage/sonar/DotNetRepoInspector.Engine.Tests/coverage.opencover.xml,artifacts/coverage/sonar/DotNetRepoInspector.Persistence.Tests/coverage.opencover.xml,artifacts/coverage/sonar/DotNetRepoInspector.Persistence.Http.Tests/coverage.opencover.xml,artifacts/coverage/sonar/DotNetRepoInspector.Cli.Tests/coverage.opencover.xml"
          /d:sonar.coverage.exclusions=".github/**"
          /d:sonar.qualitygate.wait="${SONAR_QUALITY_GATE_WAIT}"
          /d:sonar.qualitygate.timeout=300

      - name: Build for Sonar
        run: >-
          dotnet build ./DotNetRepoInspector.slnx
          --configuration Release
          --no-restore
          --no-incremental
          --disable-build-servers
          -p:RunAnalyzers=true

      - name: Test with OpenCover
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $testProjects = @(
            "tests/DotNetRepoInspector.Core.Tests/DotNetRepoInspector.Core.Tests.csproj",
            "tests/DotNetRepoInspector.MSBuild.Tests/DotNetRepoInspector.MSBuild.Tests.csproj",
            "tests/DotNetRepoInspector.Git.Tests/DotNetRepoInspector.Git.Tests.csproj",
            "tests/DotNetRepoInspector.Engine.Tests/DotNetRepoInspector.Engine.Tests.csproj",
            "tests/DotNetRepoInspector.Persistence.Tests/DotNetRepoInspector.Persistence.Tests.csproj",
            "tests/DotNetRepoInspector.Persistence.Http.Tests/DotNetRepoInspector.Persistence.Http.Tests.csproj",
            "tests/DotNetRepoInspector.Cli.Tests/DotNetRepoInspector.Cli.Tests.csproj"
          )

          foreach ($project in $testProjects) {
            $name = [IO.Path]::GetFileNameWithoutExtension($project)
            $resultsDirectory = "./artifacts/coverage/sonar/$name"

            dotnet test $project `
              --configuration Release `
              --no-build `
              --no-restore `
              --results-directory $resultsDirectory `
              -- `
              --coverlet `
              --coverlet-output-format opencover

            if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
            }

            $generatedReports = @(
              Get-ChildItem -LiteralPath $resultsDirectory -Recurse -File |
                Where-Object {
                  $_.Name -like "*opencover*.xml" -and
                  $_.Name -ne "coverage.opencover.xml"
                }
            )

            if ($generatedReports.Count -ne 1) {
              $found = if ($generatedReports.Count -eq 0) {
                "<none>"
              } else {
                $generatedReports.FullName -join ", "
              }

              throw "Expected exactly one generated OpenCover report for '$name', found $($generatedReports.Count): $found"
            }

            $normalizedReport = Join-Path $resultsDirectory "coverage.opencover.xml"
            Copy-Item -LiteralPath $generatedReports[0].FullName -Destination $normalizedReport -Force
            Write-Host "Normalized OpenCover report: $normalizedReport"
          }

      - name: Verify OpenCover reports
        shell: pwsh
        run: |
          $reports = @(
            Get-ChildItem `
              -Path "./artifacts/coverage/sonar" `
              -Filter "coverage.opencover.xml" `
              -Recurse `
              -File
          )

          if ($reports.Count -ne 7) {
            $found = if ($reports.Count -eq 0) { "<none>" } else { $reports.FullName -join ", " }
            throw "Expected seven normalized OpenCover reports, found $($reports.Count): $found"
          }

          Write-Host "Found $($reports.Count) normalized OpenCover reports."
          $reports | ForEach-Object { Write-Host $_.FullName }

      - name: End Sonar analysis
        shell: bash
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >-
          dotnet sonarscanner end
          /d:sonar.token="${SONAR_TOKEN}"

  action-smoke:
    name: GitHub Action (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    env:
      ACTION_TEST_TOOL_VERSION: "1.0.0"

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup .NET SDK for test package
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      - name: Restore CLI package graph
        run: dotnet restore ./src/DotNetRepoInspector.Cli/DotNetRepoInspector.Cli.csproj

      - name: Pack exact Action test version
        shell: pwsh
        run: >-
          dotnet pack ./src/DotNetRepoInspector.Cli/DotNetRepoInspector.Cli.csproj
          --configuration Release
          --no-restore
          --output ./artifacts/action-smoke/packages
          -p:Version=$env:ACTION_TEST_TOOL_VERSION
          -p:TreatWarningsAsErrors=true
          -p:RunAnalyzers=true

      - name: Configure isolated self-test package source
        shell: pwsh
        run: |
          $source = (Resolve-Path -LiteralPath "./artifacts/action-smoke/packages").Path
          "DOTNET_REPO_INSPECTOR_SELF_TEST_PACKAGE_SOURCE=$source" | Add-Content -LiteralPath $env:GITHUB_ENV -Encoding utf8
          "DOTNET_REPO_INSPECTOR_SELF_TEST_TOOL_VERSION=$env:ACTION_TEST_TOOL_VERSION" | Add-Content -LiteralPath $env:GITHUB_ENV -Encoding utf8

      - name: Run reusable Action
        id: inspect
        uses: ./
        with:
          path: ./tests/Fixtures/ProjectKinds
          output: ./artifacts/action-smoke/report.json
          verbosity: debug
          exclude: |
            MultiTargeting/MultiTargeting.csproj
          classify: |
            Library/Library.csproj=web

      - name: Validate Action outputs
        shell: pwsh
        env:
          REPORT_PATH: "${{ steps.inspect.outputs.report-path }}"
          SCHEMA_VERSION: "${{ steps.inspect.outputs.schema-version }}"
          INSPECTOR_VERSION: "${{ steps.inspect.outputs.inspector-version }}"
          EXIT_CODE: "${{ steps.inspect.outputs.exit-code }}"
        run: |
          if ($env:EXIT_CODE -ne "0") {
            throw "Expected Action exit code 0, actual '$env:EXIT_CODE'."
          }

          if ($env:INSPECTOR_VERSION -ne $env:ACTION_TEST_TOOL_VERSION) {
            throw "Expected Inspector version '$env:ACTION_TEST_TOOL_VERSION', actual '$env:INSPECTOR_VERSION'."
          }

          if ($env:SCHEMA_VERSION -ne "1.3") {
            throw "Expected schema version 1.3, actual '$env:SCHEMA_VERSION'."
          }

          if (-not [IO.Path]::IsPathFullyQualified($env:REPORT_PATH)) {
            throw "report-path must be absolute. Actual: '$env:REPORT_PATH'."
          }

          if (-not (Test-Path -LiteralPath $env:REPORT_PATH -PathType Leaf)) {
            throw "Action report '$env:REPORT_PATH' was not created."
          }

          $report = Get-Content -LiteralPath $env:REPORT_PATH -Raw | ConvertFrom-Json
          if (@($report.projects).Count -ne 5) {
            throw "Expected five projects after exclusion, actual '$(@($report.projects).Count)'."
          }

          if (@($report.projects | Where-Object { $_.path -eq "MultiTargeting/MultiTargeting.csproj" }).Count -ne 0) {
            throw "Excluded project is still present in the Action report."
          }

          $library = @($report.projects | Where-Object { $_.path -eq "Library/Library.csproj" }) | Select-Object -First 1
          if ($null -eq $library) {
            throw "Library project was not present in the Action report."
          }

          if ($library.classification.kind -ne "web" -or
              $library.classification.source -ne "request" -or
              $library.classification.automaticKind -ne "library") {
            throw "Action classification override provenance was not preserved."
          }

      - name: Verify non-zero CLI exit propagation and default report path
        if: matrix.os == 'ubuntu-latest'
        id: expected-failure
        continue-on-error: true
        uses: ./
        with:
          path: ./tests/Fixtures/Compatibility/MissingSdk

      - name: Validate failure propagation
        if: matrix.os == 'ubuntu-latest' && always()
        shell: pwsh
        env:
          STEP_OUTCOME: "${{ steps.expected-failure.outcome }}"
          EXIT_CODE: "${{ steps.expected-failure.outputs.exit-code }}"
          REPORT_PATH: "${{ steps.expected-failure.outputs.report-path }}"
          SCHEMA_VERSION: "${{ steps.expected-failure.outputs.schema-version }}"
        run: |
          if ($env:STEP_OUTCOME -ne "failure") {
            throw "Expected the missing-SDK Action invocation to fail, actual outcome '$env:STEP_OUTCOME'."
          }

          if ($env:EXIT_CODE -ne "1") {
            throw "Expected propagated CLI exit code 1, actual '$env:EXIT_CODE'."
          }

          if ($env:SCHEMA_VERSION -ne "1.3") {
            throw "Expected schema version 1.3 from the partial report, actual '$env:SCHEMA_VERSION'."
          }

          if (-not [IO.Path]::IsPathFullyQualified($env:REPORT_PATH)) {
            throw "Default report-path must be absolute. Actual: '$env:REPORT_PATH'."
          }

          $report = Get-Content -LiteralPath $env:REPORT_PATH -Raw | ConvertFrom-Json
          $diagnostic = @($report.diagnostics) | Where-Object { $_.code -eq "DRI1002" } | Select-Object -First 1
          if ($null -eq $diagnostic -or $diagnostic.severity -ne "error") {
            throw "Expected DRI1002/error in the report produced by the failing Action invocation."
          }

  compatibility:
    name: Compatibility (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 8.0.x

      - name: Setup Inspector SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      - name: Verify side-by-side SDKs
        shell: pwsh
        run: |
          $sdks = @(dotnet --list-sdks)
          $sdks | ForEach-Object { Write-Host $_ }

          foreach ($prefix in @("8.0.", "10.0.")) {
            $found = $sdks | Where-Object { $_.StartsWith($prefix, [StringComparison]::Ordinal) }
            if (-not $found) {
              throw "Required SDK family '$prefix' is not installed."
            }
          }

      - name: Restore
        run: dotnet restore ./DotNetRepoInspector.slnx

      - name: Build compatibility target
        run: >-
          dotnet build ./DotNetRepoInspector.slnx
          --configuration Release
          --no-restore
          --warnaserror
          -p:RunAnalyzers=true

      - name: Run compatibility smoke tests
        shell: pwsh
        run: ./.github/scripts/compatibility_smoke.ps1