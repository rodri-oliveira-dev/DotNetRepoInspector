name: Validate .NET

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    name: Restore, build and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Show .NET information
        run: dotnet --info

      - name: Restore
        run: dotnet restore ./DotNetRepoInspector.slnx

      - name: Build
        run: dotnet build ./DotNetRepoInspector.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test ./DotNetRepoInspector.slnx --configuration Release --no-build --no-restore
