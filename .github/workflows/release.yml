name: Release

run-name: "Release ${{ inputs.version || 'dry-run' }} from ${{ github.ref_name }}"

on:
  pull_request:
    branches:
      - main
      - feature/docker
    paths:
      - Dockerfile
      - .trivyignore.yaml
      - .github/workflows/release.yml
      - .github/release.yml
      - .github/release-readiness-v1.json
      - .github/scripts/container_release.sh
      - .github/scripts/release_metadata.py
      - .github/scripts/validate_tool_package.ps1
      - action.yml
      - README.md
      - README.pt-BR.md
      - docs/en/schema/examples/inspection-v1.example.json
      - docs/en/v1-release-readiness.md
      - docs/pt-BR/v1-release-readiness.md
      - src/DotNetRepoInspector.Core/Contracts/InspectionSchema.cs
      - src/DotNetRepoInspector.Cli/DotNetRepoInspector.Cli.csproj
      - tests/DotNetRepoInspector.Cli.Tests/ReleaseReadinessTests.cs
  workflow_dispatch:
    inputs:
      version:
        description: Exact Semantic Version to publish (for example 1.0.1).
        required: true
        type: string
      publish:
        description: Publish the validated package, GitHub Release, provenance, Action tags, and container image.
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: "release-${{ github.ref }}"
  cancel-in-progress: false

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  build:
    name: Build release artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: "${{ steps.release-metadata.outputs.version }}"
      tag: "${{ steps.release-metadata.outputs.tag }}"
      is-prerelease: "${{ steps.release-metadata.outputs.is_prerelease }}"
      major-alias: "${{ steps.release-metadata.outputs.major_alias }}"
      minor-alias: "${{ steps.release-metadata.outputs.minor_alias }}"

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Resolve release metadata
        id: release-metadata
        env:
          REQUESTED_VERSION: "${{ inputs.version || format('0.0.0-ci.{0}', github.run_number) }}"
        run: >-
          python ./.github/scripts/release_metadata.py resolve
          --requested-version "${REQUESTED_VERSION}"
          --github-output "${GITHUB_OUTPUT}"

      - name: Validate stable, prerelease, and immutable distribution policy
        run: |
          set -euo pipefail

          created="2026-01-02T03:04:05Z"
          stable_plan="${RUNNER_TEMP}/container-stable.json"
          prerelease_plan="${RUNNER_TEMP}/container-prerelease.json"
          synthetic_metadata="${RUNNER_TEMP}/container-build-metadata.json"
          stable_distribution="${RUNNER_TEMP}/container-distribution.json"

          python ./.github/scripts/release_metadata.py container-plan \
            --version 1.2.3 \
            --commit "${GITHUB_SHA}" \
            --created "${created}" \
            --output "${stable_plan}" >/dev/null

          jq -e --arg revision "${GITHUB_SHA}" '
            .platforms == ["linux/amd64", "linux/arm64"] and
            .tags == [
              "ghcr.io/rodri-oliveira-dev/dotnet-repo-inspector:1.2.3",
              "ghcr.io/rodri-oliveira-dev/dotnet-repo-inspector:1.2",
              "ghcr.io/rodri-oliveira-dev/dotnet-repo-inspector:1",
              "ghcr.io/rodri-oliveira-dev/dotnet-repo-inspector:latest",
              "docker.io/rodrigodotnet/dotnet-repo-inspector:1.2.3",
              "docker.io/rodrigodotnet/dotnet-repo-inspector:1.2",
              "docker.io/rodrigodotnet/dotnet-repo-inspector:1",
              "docker.io/rodrigodotnet/dotnet-repo-inspector:latest"
            ] and
            .labels["org.opencontainers.image.version"] == "1.2.3" and
            .labels["org.opencontainers.image.revision"] == $revision and
            .annotations == .labels
          ' "${stable_plan}" >/dev/null

          python ./.github/scripts/release_metadata.py container-plan \
            --version 1.2.3-rc.1 \
            --commit "${GITHUB_SHA}" \
            --created "${created}" \
            --output "${prerelease_plan}" >/dev/null

          jq -e '
            .isPrerelease == true and
            .tags == [
              "ghcr.io/rodri-oliveira-dev/dotnet-repo-inspector:1.2.3-rc.1",
              "docker.io/rodrigodotnet/dotnet-repo-inspector:1.2.3-rc.1"
            ]
          ' "${prerelease_plan}" >/dev/null

          synthetic_digest="sha256:$(printf '1%.0s' {1..64})"
          jq -n --arg digest "${synthetic_digest}" '{
            "containerimage.digest": $digest,
            "containerimage.descriptor": {"digest": $digest}
          }' > "${synthetic_metadata}"

          python ./.github/scripts/release_metadata.py container-distribution \
            --version 1.2.3 \
            --commit "${GITHUB_SHA}" \
            --plan "${stable_plan}" \
            --build-metadata "${synthetic_metadata}" \
            --output "${stable_distribution}" >/dev/null
          python ./.github/scripts/release_metadata.py verify-container-distribution \
            --version 1.2.3 \
            --commit "${GITHUB_SHA}" \
            --plan "${stable_plan}" \
            --build-metadata "${synthetic_metadata}" \
            --distribution "${stable_distribution}"

          jq -e --arg digest "${synthetic_digest}" '
            .digest == $digest and
            .platforms == ["linux/amd64", "linux/arm64"] and
            (.images | length) == 2 and
            .attestations.sbom.predicateType == "https://spdx.dev/Document" and
            .attestations.provenance.mode == "max"
          ' "${stable_distribution}" >/dev/null

      - name: Generate container release plan
        env:
          RELEASE_VERSION: "${{ steps.release-metadata.outputs.version }}"
        run: |
          set -euo pipefail
          created="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          python ./.github/scripts/release_metadata.py container-plan \
            --version "${RELEASE_VERSION}" \
            --commit "${GITHUB_SHA}" \
            --created "${created}" \
            --output ./artifacts/release/container-release-plan.json
          python ./.github/scripts/release_metadata.py verify-container-plan \
            --version "${RELEASE_VERSION}" \
            --commit "${GITHUB_SHA}" \
            --plan ./artifacts/release/container-release-plan.json

      - name: Setup QEMU for container release validation
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0
        with:
          platforms: all

      - name: Setup Docker Buildx for container release validation
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Validate multi-architecture container release build configuration
        run: bash ./.github/scripts/container_release.sh check ./artifacts/release/container-release-plan.json

      - name: Restore
        run: dotnet restore ./DotNetRepoInspector.slnx

      - name: Verify formatting
        run: >-
          dotnet format ./DotNetRepoInspector.slnx
          --verify-no-changes
          --no-restore
          --severity warn

      - name: Build with analyzers
        run: >-
          dotnet build ./DotNetRepoInspector.slnx
          --configuration Release
          --no-restore
          --warnaserror
          -p:RunAnalyzers=true
          -p:ContinuousIntegrationBuild=true

      - name: Run tests
        run: >-
          dotnet test
          --solution ./DotNetRepoInspector.slnx
          --configuration Release
          --no-build
          --no-restore
          --results-directory ./artifacts/release-test-results
          --
          --report-trx

      - name: Pack exact product version
        env:
          RELEASE_VERSION: "${{ steps.release-metadata.outputs.version }}"
        run: >-
          dotnet pack ./src/DotNetRepoInspector.Cli/DotNetRepoInspector.Cli.csproj
          --configuration Release
          --no-restore
          --output ./artifacts/release
          -p:Version=${RELEASE_VERSION}
          -p:RepositoryCommit=${GITHUB_SHA}
          -p:ContinuousIntegrationBuild=true
          -p:TreatWarningsAsErrors=true
          -p:RunAnalyzers=true

      - name: Validate packaged .NET Tool
        shell: pwsh
        env:
          RELEASE_VERSION: "${{ steps.release-metadata.outputs.version }}"
        run: >-
          ./.github/scripts/validate_tool_package.ps1
          -PackageDirectory ./artifacts/release
          -Version $env:RELEASE_VERSION
          -FixturePath ./tests/Fixtures/ProjectKinds
          -ArtifactsDirectory ./artifacts/release-smoke

      - name: Generate release manifest and checksums
        env:
          RELEASE_VERSION: "${{ steps.release-metadata.outputs.version }}"
        run: >-
          python ./.github/scripts/release_metadata.py manifest
          --version "${RELEASE_VERSION}"
          --commit "${GITHUB_SHA}"
          --package "./artifacts/release/DotNetRepoInspector.${RELEASE_VERSION}.nupkg"
          --inspection-report ./artifacts/release-smoke/global-inspection.json
          --output ./artifacts/release/release-manifest.json
          --checksums-output ./artifacts/release/SHA256SUMS

      - name: Upload validated release candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: "release-candidate-${{ steps.release-metadata.outputs.version }}"
          path: artifacts/release
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish official release
    if: "${{ github.event_name == 'workflow_dispatch' && inputs.publish }}"
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 50
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
      packages: write

    steps:
      - name: Validate protected publication request
        env:
          RELEASE_VERSION: "${{ needs.build.outputs.version }}"
          RELEASE_TAG: "${{ needs.build.outputs.tag }}"
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo "Official publication is allowed only from refs/heads/main." >&2
            exit 2
          fi

          expected_tag="v${RELEASE_VERSION}"
          if [[ "${RELEASE_TAG}" != "${expected_tag}" ]]; then
            echo "Resolved release tag must be exactly '${expected_tag}'." >&2
            exit 2
          fi

      - name: Checkout exact release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: "${{ github.sha }}"
          fetch-depth: 0
          persist-credentials: false

      - name: Download validated release candidate
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: "release-candidate-${{ needs.build.outputs.version }}"
          path: artifacts/release

      - name: Verify downloaded release candidate
        env:
          RELEASE_VERSION: "${{ needs.build.outputs.version }}"
        run: |
          set -euo pipefail
          python ./.github/scripts/release_metadata.py verify \
            --version "${RELEASE_VERSION}" \
            --commit "${GITHUB_SHA}" \
            --manifest ./artifacts/release/release-manifest.json \
            --package "./artifacts/release/DotNetRepoInspector.${RELEASE_VERSION}.nupkg"
          python ./.github/scripts/release_metadata.py verify-container-plan \
            --version "${RELEASE_VERSION}" \
            --commit "${GITHUB_SHA}" \
            --plan ./artifacts/release/container-release-plan.json

      - name: Attest release artifacts
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            artifacts/release/DotNetRepoInspector.${{ needs.build.outputs.version }}.nupkg
            artifacts/release/release-manifest.json
            artifacts/release/SHA256SUMS
            artifacts/release/container-release-plan.json

      - name: Create or resume draft GitHub Release
        env:
          GH_TOKEN: "${{ github.token }}"
          RELEASE_TAG: "${{ needs.build.outputs.tag }}"
        run: |
          set -euo pipefail

          git fetch --force --tags origin
          if git show-ref --tags --verify --quiet "refs/tags/${RELEASE_TAG}"; then
            existing_commit="$(git rev-list -n 1 "${RELEASE_TAG}")"
            if [[ "${existing_commit}" != "${GITHUB_SHA}" ]]; then
              echo "Tag ${RELEASE_TAG} already points to ${existing_commit}, not ${GITHUB_SHA}." >&2
              exit 3
            fi
          fi

          release_state="$(gh release view "${RELEASE_TAG}" --json isDraft --jq '.isDraft' 2>/dev/null || true)"
          if [[ "${release_state}" == "false" ]]; then
            echo "Release ${RELEASE_TAG} is already published; refusing to mutate an immutable release." >&2
            exit 3
          fi

          if [[ -z "${release_state}" ]]; then
            if git show-ref --tags --verify --quiet "refs/tags/${RELEASE_TAG}"; then
              gh release create "${RELEASE_TAG}" \
                --verify-tag \
                --draft \
                --generate-notes \
                --title "${RELEASE_TAG}"
            else
              gh release create "${RELEASE_TAG}" \
                --target "${GITHUB_SHA}" \
                --draft \
                --generate-notes \
                --title "${RELEASE_TAG}"
            fi
          fi

          gh release upload "${RELEASE_TAG}" artifacts/release/* --clobber

      - name: Authenticate to NuGet.org with trusted publishing
        id: nuget-login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: "${{ vars.NUGET_USER }}"

      - name: Publish .NET Tool package
        env:
          NUGET_API_KEY: "${{ steps.nuget-login.outputs.NUGET_API_KEY }}"
          RELEASE_VERSION: "${{ needs.build.outputs.version }}"
        run: >-
          dotnet nuget push
          "./artifacts/release/DotNetRepoInspector.${RELEASE_VERSION}.nupkg"
          --source https://api.nuget.org/v3/index.json
          --api-key "${NUGET_API_KEY}"
          --skip-duplicate

      - name: Configure GitHub Packages source
        env:
          GITHUB_TOKEN: "${{ github.token }}"
        run: >-
          dotnet nuget add source
          --username "${{ github.actor }}"
          --password "${GITHUB_TOKEN}"
          --store-password-in-clear-text
          --name github
          "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"

      - name: Publish .NET Tool package to GitHub Packages
        env:
          GITHUB_TOKEN: "${{ github.token }}"
          RELEASE_VERSION: "${{ needs.build.outputs.version }}"
        run: >-
          dotnet nuget push
          "./artifacts/release/DotNetRepoInspector.${RELEASE_VERSION}.nupkg"
          --source github
          --api-key "${GITHUB_TOKEN}"
          --skip-duplicate

      - name: Validate Docker Hub publication credential
        env:
          DOCKERHUB_TOKEN: "${{ secrets.DOCKERHUB_TOKEN }}"
        run: |
          set -euo pipefail
          if [[ -z "${DOCKERHUB_TOKEN}" ]]; then
            echo "DOCKERHUB_TOKEN is required for official container publication. Configure a Docker Hub access token with Read & Write permission in the protected release environment/repository secrets." >&2
            exit 4
          fi

      - name: Setup QEMU for multi-architecture publication
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0
        with:
          platforms: all

      - name: Setup Docker Buildx for multi-architecture publication
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Authenticate to GHCR and Docker Hub
        env:
          GHCR_TOKEN: "${{ github.token }}"
          DOCKERHUB_TOKEN: "${{ secrets.DOCKERHUB_TOKEN }}"
        run: |
          set -euo pipefail
          printf '%s' "${GHCR_TOKEN}" | docker login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin
          printf '%s' "${DOCKERHUB_TOKEN}" | docker login docker.io --username "rodrigodotnet" --password-stdin

      - name: Publish multi-architecture container with SBOM and provenance
        id: publish_container
        run: |
          set -euo pipefail
          metadata="${RUNNER_TEMP}/container-build-metadata.json"
          bash ./.github/scripts/container_release.sh publish \
            ./artifacts/release/container-release-plan.json \
            "${metadata}"
          digest="$(jq -er '."containerimage.digest"' "${metadata}")"
          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"
          {
            echo "### Published container digest"
            echo
            echo "\`${digest}\`"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Verify published digest, platforms, SBOM, provenance, and metadata
        run: >-
          bash ./.github/scripts/container_release.sh verify
          ./artifacts/release/container-release-plan.json
          "${RUNNER_TEMP}/container-build-metadata.json"

      - name: Generate immutable container distribution manifest
        env:
          RELEASE_VERSION: "${{ needs.build.outputs.version }}"
        run: |
          set -euo pipefail
          python ./.github/scripts/release_metadata.py container-distribution \
            --version "${RELEASE_VERSION}" \
            --commit "${GITHUB_SHA}" \
            --plan ./artifacts/release/container-release-plan.json \
            --build-metadata "${RUNNER_TEMP}/container-build-metadata.json" \
            --output ./artifacts/release/container-distribution.json
          python ./.github/scripts/release_metadata.py verify-container-distribution \
            --version "${RELEASE_VERSION}" \
            --commit "${GITHUB_SHA}" \
            --plan ./artifacts/release/container-release-plan.json \
            --build-metadata "${RUNNER_TEMP}/container-build-metadata.json" \
            --distribution ./artifacts/release/container-distribution.json

      - name: Report release HIGH/CRITICAL vulnerabilities (linux/amd64)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_PLATFORM: linux/amd64
        with:
          scan-type: image
          image-ref: "ghcr.io/rodri-oliveira-dev/dotnet-repo-inspector@${{ steps.publish_container.outputs.digest }}"
          format: table
          vuln-type: os,library
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: "0"
          version: v0.74.0

      - name: Gate release fixable HIGH/CRITICAL vulnerabilities (linux/amd64)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_PLATFORM: linux/amd64
        with:
          scan-type: image
          image-ref: "ghcr.io/rodri-oliveira-dev/dotnet-repo-inspector@${{ steps.publish_container.outputs.digest }}"
          format: table
          vuln-type: os,library
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore.yaml
          exit-code: "1"
          version: v0.74.0

      - name: Report release HIGH/CRITICAL vulnerabilities (linux/arm64)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_PLATFORM: linux/arm64
        with:
          scan-type: image
          image-ref: "ghcr.io/rodri-oliveira-dev/dotnet-repo-inspector@${{ steps.publish_container.outputs.digest }}"
          format: table
          vuln-type: os,library
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: "0"
          version: v0.74.0

      - name: Gate release fixable HIGH/CRITICAL vulnerabilities (linux/arm64)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_PLATFORM: linux/arm64
        with:
          scan-type: image
          image-ref: "ghcr.io/rodri-oliveira-dev/dotnet-repo-inspector@${{ steps.publish_container.outputs.digest }}"
          format: table
          vuln-type: os,library
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore.yaml
          exit-code: "1"
          version: v0.74.0

      - name: Attest immutable container distribution manifest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: artifacts/release/container-distribution.json

      - name: Attach verified container distribution to draft GitHub Release
        env:
          GH_TOKEN: "${{ github.token }}"
          RELEASE_TAG: "${{ needs.build.outputs.tag }}"
        run: >-
          gh release upload "${RELEASE_TAG}"
          ./artifacts/release/container-distribution.json
          --clobber

      - name: Publish GitHub Release
        env:
          GH_TOKEN: "${{ github.token }}"
          RELEASE_TAG: "${{ needs.build.outputs.tag }}"
          IS_PRERELEASE: "${{ needs.build.outputs.is-prerelease }}"
        run: |
          set -euo pipefail

          gh release edit "${RELEASE_TAG}" \
            --draft=false \
            --prerelease="${IS_PRERELEASE}" >/dev/null

      - name: Move stable GitHub Action aliases
        if: "${{ needs.build.outputs.is-prerelease == 'false' }}"
        env:
          GH_TOKEN: "${{ github.token }}"
          MAJOR_ALIAS: "${{ needs.build.outputs.major-alias }}"
          MINOR_ALIAS: "${{ needs.build.outputs.minor-alias }}"
        run: |
          set -euo pipefail

          update_alias() {
            local alias="$1"
            if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${alias}" >/dev/null 2>&1; then
              gh api --method PATCH \
                "repos/${GITHUB_REPOSITORY}/git/refs/tags/${alias}" \
                -f sha="${GITHUB_SHA}" \
                -F force=true >/dev/null
            else
              gh api --method POST \
                "repos/${GITHUB_REPOSITORY}/git/refs" \
                -f ref="refs/tags/${alias}" \
                -f sha="${GITHUB_SHA}" >/dev/null
            fi
          }

          update_alias "${MAJOR_ALIAS}"
          update_alias "${MINOR_ALIAS}"
