name: Release

run-name: "Release ${{ inputs.version || 'dry-run' }} from ${{ github.ref_name }}"

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/release.yml
      - .github/release.yml
      - .github/release-readiness-v1.json
      - .github/scripts/release_metadata.py
      - .github/scripts/validate_tool_package.ps1
      - action.yml
      - README.md
      - README.pt-BR.md
      - docs/en/schema/examples/inspection-v1.example.json
      - docs/en/v1-release-readiness.md
      - docs/pt-BR/v1-release-readiness.md
      - src/DotNetRepoInspector.Core/Contracts/InspectionSchema.cs
      - src/DotNetRepoInspector.Cli/DotNetRepoInspector.Cli.csproj
      - tests/DotNetRepoInspector.Cli.Tests/ReleaseReadinessTests.cs
  workflow_dispatch:
    inputs:
      version:
        description: Exact Semantic Version already pinned by action.yml (for example 1.0.0).
        required: true
        type: string
      publish:
        description: Publish the validated package, GitHub Release, provenance, and Action tags.
        required: true
        default: false
        type: boolean
      confirmation:
        description: When publish=true, enter release-vVERSION (for example release-v1.0.0).
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: "release-${{ github.ref }}"
  cancel-in-progress: false

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  build:
    name: Build release artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: "${{ steps.release-metadata.outputs.version }}"
      tag: "${{ steps.release-metadata.outputs.tag }}"
      is-prerelease: "${{ steps.release-metadata.outputs.is_prerelease }}"
      major-alias: "${{ steps.release-metadata.outputs.major_alias }}"
      minor-alias: "${{ steps.release-metadata.outputs.minor_alias }}"

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Resolve release metadata
        id: release-metadata
        env:
          REQUESTED_VERSION: "${{ inputs.version }}"
        run: >-
          python ./.github/scripts/release_metadata.py resolve
          --action-metadata ./action.yml
          --requested-version "${REQUESTED_VERSION}"
          --github-output "${GITHUB_OUTPUT}"

      - name: Restore
        run: dotnet restore ./DotNetRepoInspector.slnx

      - name: Verify formatting
        run: >-
          dotnet format ./DotNetRepoInspector.slnx
          --verify-no-changes
          --no-restore
          --severity warn

      - name: Build with analyzers
        run: >-
          dotnet build ./DotNetRepoInspector.slnx
          --configuration Release
          --no-restore
          --warnaserror
          -p:RunAnalyzers=true
          -p:ContinuousIntegrationBuild=true

      - name: Run tests
        run: >-
          dotnet test
          --solution ./DotNetRepoInspector.slnx
          --configuration Release
          --no-build
          --no-restore
          --results-directory ./artifacts/release-test-results
          --
          --report-trx

      - name: Pack exact product version
        env:
          RELEASE_VERSION: "${{ steps.release-metadata.outputs.version }}"
        run: >-
          dotnet pack ./src/DotNetRepoInspector.Cli/DotNetRepoInspector.Cli.csproj
          --configuration Release
          --no-restore
          --output ./artifacts/release
          -p:Version=${RELEASE_VERSION}
          -p:RepositoryCommit=${GITHUB_SHA}
          -p:ContinuousIntegrationBuild=true
          -p:TreatWarningsAsErrors=true
          -p:RunAnalyzers=true

      - name: Validate packaged .NET Tool
        shell: pwsh
        env:
          RELEASE_VERSION: "${{ steps.release-metadata.outputs.version }}"
        run: >-
          ./.github/scripts/validate_tool_package.ps1
          -PackageDirectory ./artifacts/release
          -Version $env:RELEASE_VERSION
          -FixturePath ./tests/Fixtures/ProjectKinds
          -ArtifactsDirectory ./artifacts/release-smoke

      - name: Generate release manifest and checksums
        env:
          RELEASE_VERSION: "${{ steps.release-metadata.outputs.version }}"
        run: >-
          python ./.github/scripts/release_metadata.py manifest
          --version "${RELEASE_VERSION}"
          --commit "${GITHUB_SHA}"
          --package "./artifacts/release/DotNetRepoInspector.${RELEASE_VERSION}.nupkg"
          --inspection-report ./artifacts/release-smoke/global-inspection.json
          --output ./artifacts/release/release-manifest.json
          --checksums-output ./artifacts/release/SHA256SUMS

      - name: Upload validated release candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: "release-candidate-${{ steps.release-metadata.outputs.version }}"
          path: artifacts/release
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish official release
    if: "${{ github.event_name == 'workflow_dispatch' && inputs.publish }}"
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
      packages: write

    steps:
      - name: Validate protected publication request
        env:
          RELEASE_VERSION: "${{ needs.build.outputs.version }}"
          RELEASE_CONFIRMATION: "${{ inputs.confirmation }}"
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo "Official publication is allowed only from refs/heads/main." >&2
            exit 2
          fi

          expected="release-v${RELEASE_VERSION}"
          if [[ "${RELEASE_CONFIRMATION}" != "${expected}" ]]; then
            echo "Publication confirmation must be exactly '${expected}'." >&2
            exit 2
          fi

      - name: Checkout exact release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: "${{ github.sha }}"
          fetch-depth: 0
          persist-credentials: false

      - name: Download validated release candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: "release-candidate-${{ needs.build.outputs.version }}"
          path: artifacts/release

      - name: Verify downloaded release candidate
        env:
          RELEASE_VERSION: "${{ needs.build.outputs.version }}"
        run: >-
          python ./.github/scripts/release_metadata.py verify
          --version "${RELEASE_VERSION}"
          --commit "${GITHUB_SHA}"
          --manifest ./artifacts/release/release-manifest.json
          --package "./artifacts/release/DotNetRepoInspector.${RELEASE_VERSION}.nupkg"

      - name: Attest release artifacts
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            artifacts/release/DotNetRepoInspector.${{ needs.build.outputs.version }}.nupkg
            artifacts/release/release-manifest.json
            artifacts/release/SHA256SUMS

      - name: Create or resume draft GitHub Release
        env:
          GH_TOKEN: "${{ github.token }}"
          RELEASE_TAG: "${{ needs.build.outputs.tag }}"
        run: |
          set -euo pipefail

          git fetch --force --tags origin
          if git show-ref --tags --verify --quiet "refs/tags/${RELEASE_TAG}"; then
            existing_commit="$(git rev-list -n 1 "${RELEASE_TAG}")"
            if [[ "${existing_commit}" != "${GITHUB_SHA}" ]]; then
              echo "Tag ${RELEASE_TAG} already points to ${existing_commit}, not ${GITHUB_SHA}." >&2
              exit 3
            fi
          fi

          release_state="$(gh release view "${RELEASE_TAG}" --json isDraft --jq '.isDraft' 2>/dev/null || true)"
          if [[ "${release_state}" == "false" ]]; then
            echo "Release ${RELEASE_TAG} is already published; refusing to mutate an immutable release." >&2
            exit 3
          fi

          if [[ -z "${release_state}" ]]; then
            if git show-ref --tags --verify --quiet "refs/tags/${RELEASE_TAG}"; then
              gh release create "${RELEASE_TAG}" \
                --verify-tag \
                --draft \
                --generate-notes \
                --title "${RELEASE_TAG}"
            else
              gh release create "${RELEASE_TAG}" \
                --target "${GITHUB_SHA}" \
                --draft \
                --generate-notes \
                --title "${RELEASE_TAG}"
            fi
          fi

          gh release upload "${RELEASE_TAG}" artifacts/release/* --clobber

      - name: Authenticate to NuGet.org with trusted publishing
        id: nuget-login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: "${{ vars.NUGET_USER }}"

      - name: Publish .NET Tool package
        env:
          NUGET_API_KEY: "${{ steps.nuget-login.outputs.NUGET_API_KEY }}"
          RELEASE_VERSION: "${{ needs.build.outputs.version }}"
        run: >-
          dotnet nuget push
          "./artifacts/release/DotNetRepoInspector.${RELEASE_VERSION}.nupkg"
          --source https://api.nuget.org/v3/index.json
          --api-key "${NUGET_API_KEY}"
          --skip-duplicate

      - name: Configure GitHub Packages source
        env:
          GITHUB_TOKEN: "${{ github.token }}"
        run: >-
          dotnet nuget add source
          --username "${{ github.actor }}"
          --password "${GITHUB_TOKEN}"
          --store-password-in-clear-text
          --name github
          "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"

      - name: Publish .NET Tool package to GitHub Packages
        env:
          GITHUB_TOKEN: "${{ github.token }}"
          RELEASE_VERSION: "${{ needs.build.outputs.version }}"
        run: >-
          dotnet nuget push
          "./artifacts/release/DotNetRepoInspector.${RELEASE_VERSION}.nupkg"
          --source github
          --api-key "${GITHUB_TOKEN}"
          --skip-duplicate

      - name: Publish GitHub Release
        env:
          GH_TOKEN: "${{ github.token }}"
          RELEASE_TAG: "${{ needs.build.outputs.tag }}"
          IS_PRERELEASE: "${{ needs.build.outputs.is-prerelease }}"
        run: |
          set -euo pipefail

          gh release edit "${RELEASE_TAG}" \
            --draft=false \
            --prerelease="${IS_PRERELEASE}" >/dev/null

      - name: Move stable GitHub Action aliases
        if: "${{ needs.build.outputs.is-prerelease == 'false' }}"
        env:
          GH_TOKEN: "${{ github.token }}"
          MAJOR_ALIAS: "${{ needs.build.outputs.major-alias }}"
          MINOR_ALIAS: "${{ needs.build.outputs.minor-alias }}"
        run: |
          set -euo pipefail

          update_alias() {
            local alias="$1"
            if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${alias}" >/dev/null 2>&1; then
              gh api --method PATCH \
                "repos/${GITHUB_REPOSITORY}/git/refs/tags/${alias}" \
                -f sha="${GITHUB_SHA}" \
                -F force=true >/dev/null
            else
              gh api --method POST \
                "repos/${GITHUB_REPOSITORY}/git/refs" \
                -f ref="refs/tags/${alias}" \
                -f sha="${GITHUB_SHA}" >/dev/null
            fi
          }

          update_alias "${MAJOR_ALIAS}"
          update_alias "${MINOR_ALIAS}"
