name: CodeQL

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  schedule:
    - cron: '17 8 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "codeql-${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  analyze:
    name: Analyze C# with CodeQL
    runs-on: ${{ vars.RUNNER_OS || 'ubuntu-26.04' }}
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Validate consistent CodeQL action pins
        shell: bash
        run: |
          mapfile -t codeql_refs < <(grep -Eo 'github/codeql-action/[^@ ]+@[0-9a-f]{40}' .github/workflows/codeql.yml)
          if (( ${#codeql_refs[@]} < 2 )); then
            echo "::error::Expected at least two SHA-pinned CodeQL steps."
            exit 1
          fi
          sha_count=$(printf '%s\n' "${codeql_refs[@]}" | cut -d@ -f2 | sort -u | wc -l)
          if (( sha_count != 1 )); then
            echo "::error::All CodeQL steps must use the same commit SHA."
            exit 1
          fi

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          global-json-file: global.json

      - name: Initialize CodeQL
        uses: github/codeql-action/init@ce8b5602e2e75eddc698f13db2342ef698999255 # v4
        with:
          languages: csharp
          build-mode: manual

      - name: Restore
        run: dotnet restore ./DotNetRepoInspector.slnx

      - name: Build for analysis
        run: >-
          dotnet build ./DotNetRepoInspector.slnx
          --configuration Release
          --no-restore
          --warnaserror
          -p:RunAnalyzers=true

      - name: Analyze
        uses: github/codeql-action/analyze@ce8b5602e2e75eddc698f13db2342ef698999255 # v4
        with:
          category: '/language:csharp'
          output: ./artifacts/codeql
          upload: never
          upload-database: false

      - name: Upload CodeQL SARIF artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: codeql-csharp-sarif
          path: artifacts/codeql/*.sarif
          if-no-files-found: warn
          retention-days: 7
